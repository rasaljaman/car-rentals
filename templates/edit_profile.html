{% extends 'base.html' %}

{% block title %}Edit Profile - Sura Rentals{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Edit Profile</h1>
    
    <form method="POST" enctype="multipart/form-data" class="bg-white rounded-lg shadow p-6 space-y-6">
        {% csrf_token %}
        
        <!-- Profile Photo -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Profile Photo</label>
            {% if user.profile.profile_photo %}
                <img src="{{ user.profile.profile_photo.url }}" alt="Profile" class="h-20 w-20 rounded-full mb-4 object-cover">
            {% else %}
                <img src="https://ui-avatars.com/api/?name={{ user.first_name }}+{{ user.last_name }}&background=0d8abc&color=fff&size=100" 
                     alt="Profile" class="h-20 w-20 rounded-full mb-4">
            {% endif %}
            <input type="file" name="profile_photo" class="block w-full" accept="image/*">
        </div>
        
        <!-- Name -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" 
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600">
            </div>
            <div>
                <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" 
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600">
            </div>
        </div>
        
        <!-- Bio -->
        <div>
            <label for="bio" class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
            <textarea id="bio" name="bio" rows="4" 
                      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600">{{ user.profile.bio }}</textarea>
        </div>
        
        <!-- Submit -->
        <div class="flex gap-4">
            <button type="submit" class="bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700 transition font-semibold">
                Save Changes
            </button>
            <a href="{% url 'dashboard' %}" class="bg-gray-300 text-gray-900 px-6 py-2 rounded-lg hover:bg-gray-400 transition font-semibold">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
