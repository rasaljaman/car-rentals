<nav class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a href="{% url 'home' %}" class="flex items-center space-x-2">
                <i class="fas fa-car text-teal-600 text-2xl"></i>
                <span class="text-2xl font-bold text-teal-600">Sura Rentals</span>
            </a>
            
            <!-- Navigation Links -->
            <div class="hidden md:flex items-center space-x-8">
                <a href="{% url 'browse_cars' %}" class="text-gray-700 hover:text-teal-600 transition">Browse Cars</a>
                
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-gray-700 hover:text-teal-600 transition">Dashboard</a>
                    
                    {% if user.role == 'admin' %}
                        <a href="/admin/" class="text-gray-700 hover:text-teal-600 transition">Admin Panel</a>
                    {% endif %}
                    
                    <div class="relative group">
                        <button class="flex items-center space-x-2 text-gray-700 hover:text-teal-600 transition">
                            <img src="https://ui-avatars.com/api/?name={{ user.first_name }}+{{ user.last_name }}&background=0d8abc&color=fff" 
                                 alt="{{ user.email }}" class="h-8 w-8 rounded-full">
                            <span class="text-sm">{{ user.first_name|default:user.email }}</span>
                        </button>
                        
                        <div class="absolute right-0 mt-0 w-48 bg-white rounded-lg shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none group-hover:pointer-events-auto">
                            <a href="{% url 'edit_profile' %}" class="block px-4 py-2 text-gray-700 hover:bg-teal-50 first:rounded-t-lg">
                                <i class="fas fa-user mr-2"></i> Profile
                            </a>
                            <a href="{% url 'my_bookings' %}" class="block px-4 py-2 text-gray-700 hover:bg-teal-50">
                                <i class="fas fa-calendar mr-2"></i> My Bookings
                            </a>
                            <a href="{% url 'dashboard' %}" class="block px-4 py-2 text-gray-700 hover:bg-teal-50">
                                <i class="fas fa-cog mr-2"></i> Settings
                            </a>
                            <form method="POST" action="{% url 'logout' %}" class="block">
                                {% csrf_token %}
                                <button type="submit" class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 last:rounded-b-lg transition">
                                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                                </button>
                            </form>
                        </div>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="text-gray-700 hover:text-teal-600 transition">Log In</a>
                    <a href="{% url 'signup_step1' %}" class="bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600 transition font-medium">Sign Up</a>
                {% endif %}
            </div>
            
            <!-- Mobile menu button -->
            <button class="md:hidden text-gray-700" x-data="{ open: false }" @click="open = !open">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </div>
</nav>
